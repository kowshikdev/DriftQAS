name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m driftqas run --config configs/smoke.yaml --output results/ci-smoke
      - run: python -m driftqas suite --config configs/suite_smoke.yaml --output results/ci-suite
      - run: python -m driftqas suite --config configs/suite_smoke.yaml --output results/ci-suite --resume

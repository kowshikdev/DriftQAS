[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "driftqas"
version = "0.2.0"
description = "Budgeted quantum circuit selection with circuit-aware evidence reuse under simulated drift"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "qiskit>=2.1,<3", "qiskit-aer>=0.17,<0.18", "numpy>=1.24,<3",
  "scipy>=1.11,<2", "scikit-learn>=1.3,<2", "PyYAML>=6,<7",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
driftqas = "driftqas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

# Tiny workflow validation, not scientific evidence. 19 calibration clusters is
# the minimum finite order statistic at alpha=0.05; final H2 study uses 20.
name: exposure-ci-v04
split: development
seed_sets:
  development: [3]
  calibration: [401, 402, 403, 404, 405, 406, 407, 408, 409, 410, 411, 412, 413, 414, 415, 416, 417, 418, 419]
  held_out: [501, 502]
base:
  task: h2
  candidates: 2
  bank_design: stratified
  training_evaluations: 4
  epochs: 2
  budget_per_epoch: 128
  confirmation_fraction: 0.2
  low_shots: 8
  high_shots: 16
  initial_seeds: 1
  policies: [reuse_racing, driftqas_racing, ideal_only]
cases:
  - id: abrupt
    overrides: {scenario: abrupt, drift_error: 0.12}
primary_target: driftqas_racing
primary_comparator: reuse_racing
bootstrap_samples: 100

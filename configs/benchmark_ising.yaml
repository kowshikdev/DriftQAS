# Protocol candidate. Run development first; freeze before changing split to held_out.
# This file has not been tuned or established as a sufficiently powered study.
name: ising-benchmark-v1
split: development
seed_sets:
  development: [7, 19, 31, 43, 59]
  held_out: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010]
primary_target: driftqas
primary_comparator: reuse
bootstrap_samples: 10000
bootstrap_seed: 2026
base:
  task: ising
  n_qubits: 4
  field: 0.5
  candidates: 12
  training_evaluations: 160
  epochs: 6
  base_error: 0.005
  drift_error: 0.04
  changed_edge: 1-2
  budget_per_epoch: 8192
  confirmation_fraction: 0.2
  low_shots: 128
  high_shots: 512
  initial_seeds: 3
  drift_scale: 0.02
  forgetting: 1.0
  policies: [random, restart, reuse, global_forgetting, periodic_refresh, driftqas,
             driftqas_global_relevance, driftqas_no_refresh, driftqas_fixed_shots]
cases:
  - id: f05-stable-low
    overrides: {field: 0.5, scenario: stable, budget_per_epoch: 8192}
  - id: f05-abrupt-low
    overrides: {field: 0.5, scenario: abrupt, budget_per_epoch: 8192}
  - id: f05-gradual-low
    overrides: {field: 0.5, scenario: gradual, budget_per_epoch: 8192}
  - id: f05-recurring-low
    overrides: {field: 0.5, scenario: recurring, budget_per_epoch: 8192}
  - id: f05-stable-high
    overrides: {field: 0.5, scenario: stable, budget_per_epoch: 16384}
  - id: f05-abrupt-high
    overrides: {field: 0.5, scenario: abrupt, budget_per_epoch: 16384}
  - id: f05-gradual-high
    overrides: {field: 0.5, scenario: gradual, budget_per_epoch: 16384}
  - id: f05-recurring-high
    overrides: {field: 0.5, scenario: recurring, budget_per_epoch: 16384}
  - id: f10-stable-low
    overrides: {field: 1.0, scenario: stable, budget_per_epoch: 8192}
  - id: f10-abrupt-low
    overrides: {field: 1.0, scenario: abrupt, budget_per_epoch: 8192}
  - id: f10-gradual-low
    overrides: {field: 1.0, scenario: gradual, budget_per_epoch: 8192}
  - id: f10-recurring-low
    overrides: {field: 1.0, scenario: recurring, budget_per_epoch: 8192}
  - id: f10-stable-high
    overrides: {field: 1.0, scenario: stable, budget_per_epoch: 16384}
  - id: f10-abrupt-high
    overrides: {field: 1.0, scenario: abrupt, budget_per_epoch: 16384}
  - id: f10-gradual-high
    overrides: {field: 1.0, scenario: gradual, budget_per_epoch: 16384}
  - id: f10-recurring-high
    overrides: {field: 1.0, scenario: recurring, budget_per_epoch: 16384}

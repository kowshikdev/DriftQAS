# End-to-end development validation. Three seeds are too few for confidence intervals.
name: suite-smoke
split: development
seed_sets:
  development: [7, 19, 31]
  held_out: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010]
primary_target: driftqas
primary_comparator: reuse
bootstrap_samples: 5000
bootstrap_seed: 2026
base:
  task: h2
  candidates: 3
  training_evaluations: 40
  epochs: 2
  base_error: 0.005
  drift_error: 0.04
  changed_edge: 0-1
  budget_per_epoch: 1024
  confirmation_fraction: 0.2
  low_shots: 32
  high_shots: 64
  initial_seeds: 1
  policies: [random, restart, reuse, global_forgetting, periodic_refresh, driftqas,
             driftqas_global_relevance, driftqas_no_refresh, driftqas_fixed_shots]
cases:
  - id: h2-stable
    overrides: {scenario: stable}
  - id: h2-abrupt
    overrides: {scenario: abrupt}

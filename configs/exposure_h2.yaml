# Mechanism-focused synthetic H2 study. Cal/test are not run during development.
name: exposure-h2-v04
split: development
seed_sets:
  development: [7, 19, 31, 43, 59]
  calibration: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120]
  held_out: [2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
base:
  task: h2
  candidates: 8
  bank_design: stratified
  training_evaluations: 120
  epochs: 4
  base_error: 0.005
  drift_error: 0.12
  changed_edge: 0-1
  budget_per_epoch: 2048
  confirmation_fraction: 0.2
  low_shots: 32
  high_shots: 128
  initial_seeds: 2
  racing_beta: 2.0
  racing_floor: 0.002
  policies: [reuse, driftqas, ideal_only, fresh_racing, reuse_racing, global_racing, driftqas_racing, driftqas_racing_uniform]
cases:
  - id: stable
    overrides: {scenario: stable}
  - id: abrupt-mild
    overrides: {scenario: abrupt, drift_error: 0.04}
  - id: abrupt-stress
    overrides: {scenario: abrupt}
  - id: recurring-stress
    overrides: {scenario: recurring}
primary_target: driftqas_racing
primary_comparator: reuse_racing
bootstrap_samples: 10000
bootstrap_seed: 2026
